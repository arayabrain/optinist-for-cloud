name: Tests

on:
  pull_request:
    branches:
      - main
      - develop-main
      - future
      - "future/**"
    paths-ignore:
      - "docs/**"

  workflow_dispatch:

  # Called by the weekly regression workflow so its jobs are defined once.
  workflow_call:

# Test jobs are separated for parallel execution and clearer failure identification
jobs:
  # Backend and Lambda tests
  test_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run backend tests
        shell: bash
        run: |
          make test_backend

      - name: Run lambda tests
        shell: bash
        run: |
          make test_lambda

  # Frontend tests
  test_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run frontend tests
        shell: bash
        run: |
          make test_frontend
