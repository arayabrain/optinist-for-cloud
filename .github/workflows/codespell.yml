name: Codespell
on:
  pull_request:

# Least-privilege default: jobs opt in to anything beyond reading the repo.
permissions:
  contents: read

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: codespell-project/actions-codespell@v2
        with:
          args: "--skip='./dist,./frontend/node_modules,./logs'"
